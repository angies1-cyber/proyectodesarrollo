server.port=${PORT:8081}

spring.application.name=auth-service

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clinica}
spring.datasource.username=${DB_USERNAME:clinica}
spring.datasource.password=${DB_PASSWORD:clinica}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway uses an independent history table because both services share a database.
spring.flyway.table=flyway_auth_history
spring.flyway.locations=classpath:db/migration

# RSA Keys Locations
rsa.private-key=${RSA_PRIVATE_KEY:file:./secrets/private.pem}
rsa.public-key=${RSA_PUBLIC_KEY:file:./secrets/public.pem}
rsa.private-key-base64=${RSA_PRIVATE_KEY_BASE64:}
rsa.public-key-base64=${RSA_PUBLIC_KEY_BASE64:}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.frontend-url=${CLINICA_FRONTEND_URL:http://localhost:4200}
app.initial-admin.username=${INITIAL_ADMIN_USERNAME:}
app.initial-admin.email=${INITIAL_ADMIN_EMAIL:}
app.initial-admin.password=${INITIAL_ADMIN_PASSWORD:}

# Login abuse controls. Durations use ISO-8601 notation.
app.auth-security.rate-limit=10
app.auth-security.rate-window=PT1M
app.auth-security.max-failed-attempts=5
app.auth-security.lock-duration=PT15M

# Cloudflare official always-pass test secret. Production overrides it with a required environment variable.
app.turnstile.secret-key=${TURNSTILE_SECRET_KEY:1x0000000000000000000000000000000AA}
app.turnstile.expected-action=${TURNSTILE_EXPECTED_ACTION:}
app.turnstile.allowed-hostnames=${TURNSTILE_HOSTNAMES:}
app.turnstile.require-hostname=false

# Honor X-Forwarded-For from Render's trusted internal reverse proxy; direct local requests use the socket IP.
server.forward-headers-strategy=native

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
