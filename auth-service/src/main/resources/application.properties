server.port=8081

spring.application.name=auth-service

# SQL Server Configuration (Soporta Variables de Entorno con fallback seguro)
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1435;databaseName=proyecto_clientes;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:Guate2026++}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# RSA Keys Locations
rsa.private-key=classpath:certs/private.pem
rsa.public-key=classpath:certs/public.pem

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
