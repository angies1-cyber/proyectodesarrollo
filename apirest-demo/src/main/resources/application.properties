spring.application.name=api-demo
server.port=${PORT:8082}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clinica}
spring.datasource.username=${DB_USERNAME:clinica}
spring.datasource.password=${DB_PASSWORD:clinica}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway uses an independent history table because both services share a database.
spring.flyway.table=flyway_clinic_history
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# RSA Public Key Location
rsa.public-key=${RSA_PUBLIC_KEY:file:./secrets/public.pem}
rsa.public-key-base64=${RSA_PUBLIC_KEY_BASE64:}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
