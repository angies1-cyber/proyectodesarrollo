services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-clinica}
      POSTGRES_USER: ${DB_USERNAME:-clinica}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-clinica}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-clinica} -d ${DB_NAME:-clinica}"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./auth-service
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-clinica}
      DB_USERNAME: ${DB_USERNAME:-clinica}
      DB_PASSWORD: ${DB_PASSWORD:-clinica}
      RSA_PRIVATE_KEY_BASE64: ${RSA_PRIVATE_KEY_BASE64:?Configure RSA_PRIVATE_KEY_BASE64 in .env}
      RSA_PUBLIC_KEY_BASE64: ${RSA_PUBLIC_KEY_BASE64:?Configure RSA_PUBLIC_KEY_BASE64 in .env}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-superadmin}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-superadmin@example.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-change-me}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-1x0000000000000000000000000000000AA}
      TURNSTILE_HOSTNAMES: ${TURNSTILE_HOSTNAMES:-}
    depends_on:
      postgres:
        condition: service_healthy

  backend-api:
    build: ./apirest-demo
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-clinica}
      DB_USERNAME: ${DB_USERNAME:-clinica}
      DB_PASSWORD: ${DB_PASSWORD:-clinica}
      RSA_PUBLIC_KEY_BASE64: ${RSA_PUBLIC_KEY_BASE64:?Configure RSA_PUBLIC_KEY_BASE64 in .env}
    depends_on:
      postgres:
        condition: service_healthy

  clinica-frontend:
    build:
      context: ./clinica-frontend
      args:
        AUTH_API_BASE_URL: http://localhost:8081
        CLINIC_API_BASE_URL: http://localhost:8082
        TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
    ports:
      - "4200:80"
    depends_on:
      - auth-service
      - backend-api
